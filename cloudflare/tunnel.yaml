apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: kube-system  # Wrzucamy to do systemowego namespace
  labels:
    app: cloudflared
spec:
  replicas: 2             # Dwa tunele dla High Availability! (Jak jeden padnie, drugi działa)
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        - --token
        - <CLOUDFLARE_TUNNEL_TOKEN>
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
